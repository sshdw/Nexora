# RustSec and license policy for the root workspace and its Cargo.lock.
# The independent desktop workspace uses src-tauri/deny.toml.
#
# PR-1 added `nexora-runtime` (the extracted Tauri-free backend) and its
# `reqwest`/`ring`/`git2`/keyring dependency tree. The exceptions below are the
# non-Tauri license exceptions from src-tauri/deny.toml at the EXACT versions in
# this lockfile. PR-2 added the CLI's OS clipboard adapter (`arboard`), whose
# Windows transitives `clipboard-win` and `error-code` are BSL-1.0
# (OSI-approved permissive) and are excepted below at their exact versions only
# — BSL-1.0 is deliberately NOT in the global allow list. The five MPL-2.0
# exceptions are Tauri-only and intentionally stay in src-tauri/deny.toml;
# RUSTSEC-2024-0370 is likewise Tauri-only.

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitives: ignored (never vulnerabilities) until upstream replaces them.
# The root lockfile has no proc-macro-error, so RUSTSEC-2024-0370 is only ignored in
# src-tauri/deny.toml; everything else is kept in sync between the two files.
ignore = [
    # unmaintained, no vulnerability, transitive via zbus 5.x (keyring -> zbus-secret-service-keyring-store -> secret-service) — revisit when upstream replaces it
    "RUSTSEC-2026-0370",
    # unmaintained, no vulnerability, transitive via zbus 5.x / zbus_macros 5.x (keyring -> zbus-secret-service-keyring-store -> secret-service) — revisit when upstream replaces it
    "RUSTSEC-2026-0371",
    # unmaintained, no vulnerability, transitive via zvariant 5.x <- zbus 5.x (keyring -> zbus-secret-service-keyring-store -> secret-service) — revisit when upstream replaces it
    "RUSTSEC-2026-0372",
]

[licenses]
allow = ["MIT", "Apache-2.0"]
# These exceptions apply to the exact versions already in the root lockfile.
exceptions = [
    { crate = "aws-lc-rs@1.19.0", allow = ["ISC"] },
    { crate = "aws-lc-sys@0.47.0", allow = ["BSD-3-Clause", "ISC"] },
    { crate = "clipboard-win@5.4.3", allow = ["BSL-1.0"] },
    { crate = "error-code@3.4.0", allow = ["BSL-1.0"] },
    { crate = "foldhash@0.2.0", allow = ["Zlib"] },
    { crate = "icu_collections@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "icu_locale_core@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "icu_normalizer@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "icu_normalizer_data@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "icu_properties@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "icu_properties_data@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "icu_provider@2.4.0", allow = ["Unicode-3.0"] },
    { crate = "litemap@0.8.3", allow = ["Unicode-3.0"] },
    { crate = "potential_utf@0.1.6", allow = ["Unicode-3.0"] },
    { crate = "ring@0.17.14", allow = ["ISC"] },
    { crate = "rustls-webpki@0.103.17", allow = ["ISC"] },
    { crate = "subtle@2.6.1", allow = ["BSD-3-Clause"] },
    { crate = "tinystr@0.8.5", allow = ["Unicode-3.0"] },
    { crate = "unicode-ident@1.0.27", allow = ["Unicode-3.0"] },
    { crate = "untrusted@0.9.0", allow = ["ISC"] },
    { crate = "webpki-root-certs@1.0.12", allow = ["CDLA-Permissive-2.0"] },
    { crate = "winx@0.36.4", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { crate = "writeable@0.6.4", allow = ["Unicode-3.0"] },
    { crate = "yoke@0.8.4", allow = ["Unicode-3.0"] },
    { crate = "yoke-derive@0.8.4", allow = ["Unicode-3.0"] },
    { crate = "zerofrom@0.1.8", allow = ["Unicode-3.0"] },
    { crate = "zerofrom-derive@0.1.8", allow = ["Unicode-3.0"] },
    { crate = "zerotrie@0.2.5", allow = ["Unicode-3.0"] },
    { crate = "zerovec@0.11.9", allow = ["Unicode-3.0"] },
    { crate = "zerovec-derive@0.11.7", allow = ["Unicode-3.0"] },
]
