[package]
name = "nexora-runtime"
version = "2.0.0"
description = "Tauri-free shared backend runtime: application services and infrastructure adapters for the Nexora shells"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[dependencies]
# The SAME dependency set the desktop backend links, minus Tauri and its
# plugins. `src-tauri` keeps its own declarations (Cargo requires them for the
# excluded workspace); the arrow stays shell -> runtime -> core, never back.
nexora-core = { path = "../nexora-core" }
nexora-os-exec = { path = "../nexora-os-exec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
log = "0.4"
keyring = "4"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
url = "2"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.0"
tree-sitter-powershell = "=0.26.4"
sha2 = "=0.10.9"
ring = "=0.17.14"
uuid = { version = "=1.24.0", features = ["v4"] }
portable-pty = "0.9.0"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
flate2 = "1"

# No async runtime is named in the production dependency list. Shells inject
# one through `AsyncSpawner`; the desktop uses Tauri's runtime.
[dev-dependencies]
# Test-only reactor for `reqwest`'s async client. `reqwest` already pulls
# Tokio into the graph transitively; this only exposes the driver to the
# unit tests that exercise the real HTTP transport against local servers.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }

[target.'cfg(windows)'.dependencies]
winx = "=0.36.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
