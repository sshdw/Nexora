[package]
name = "nexora-core"
version = "0.1.0"
description = "Shared, interface-free Nexora core: stable error taxonomy + exit-code mapping, three-manifest version parity, allow-listed config keys and validation"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[dependencies]
# Phase 1 extracts only rules that are already expressed as data (version
# strings, key lists, enum taxonomies). JSON parsing is the single capability
# the desktop's manifest parity check needs; it is not a UI/CLI framework.
#
# HARD RULE (brief §2.3/§2.4): this crate must never depend on Tauri,
# React, Ratatui or Clap. Those are shell concerns; the desktop adapter
# (src-tauri) and the CLI adapter (apps/nexora-cli) depend on THIS crate,
# never the reverse. `cargo tree` is the enforcement in CI.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"