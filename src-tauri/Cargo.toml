[package]
name = "nexora"
version = "2.0.0"
description = "Local-first AI desktop application"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shared, interface-free core (issue #160, brief §2.3/§2.4): the stable error
# taxonomy, the three-manifest version parity logic, and the allow-listed
# config keys. This is a PLAIN PATH DEPENDENCY across the workspace exclusion:
# `src-tauri` stays excluded from the root workspace (own manifest, lockfile,
# target dir, pinned toolchain, Tauri build untouched), while depending on one
# member of it. The dependency arrow points desktop -> core, never the reverse:
# `nexora-core` does not know Tauri exists.
nexora-core = { path = "../crates/nexora-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
log = "0.4"
keyring = "4"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-dialog = "2.8.3"
# ADD-10 (session-state persistence, review 05 §3.5b): restores window
# geometry (size/position/maximized) natively on launch and saves it on
# exit — the fixed 1200x800 in tauri.conf.json stays only as the FIRST-run
# default. Pinned to the same tauri 2.x line as tauri-plugin-dialog.
tauri-plugin-window-state = "2.5.0"
# 02-SECURITY-FRONTEND-IPC.md §4.2.3 / §6.1: the opener plugin is re-added
# for exactly one sink — `open_external_url` (commands/system.rs), which
# opens a user-clicked, backend-validated absolute http(s) URL. The Rust-side
# call is the only invocation path; the webview capability grants ONLY
# `opener:allow-open-url` with a https-only URL scope (never `opener:default`,
# which would also grant open_path / reveal_item_in_dir and http). Pinned to
# the same tauri 2.x line as the other plugins.
tauri-plugin-opener = "2.5.4"
# WHATWG URL parser for the command-side validator (§4.2.3): scheme,
# absoluteness and userinfo checks come from the spec parser, not regex.
url = "2"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.0"
tree-sitter-powershell = "=0.26.4"
sha2 = "=0.10.9"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
