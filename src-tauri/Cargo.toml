[package]
name = "nexora"
version = "2.0.0"
description = "Local-first AI desktop application"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shared, interface-free core (issue #160, brief §2.3/§2.4): the stable error
# taxonomy, the three-manifest version parity logic, and the allow-listed
# config keys. This is a PLAIN PATH DEPENDENCY across the workspace exclusion:
# `src-tauri` stays excluded from the root workspace (own manifest, lockfile,
# target dir, pinned toolchain, Tauri build untouched), while depending on one
# member of it. The dependency arrow points desktop -> core, never the reverse:
# `nexora-core` does not know Tauri exists.
nexora-core = { path = "../crates/nexora-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
keyring = "4"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.5.1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
