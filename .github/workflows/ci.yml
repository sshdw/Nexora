name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Wall-clock split: fmt (no build), Rust gates per OS (clippy + test share
# one target dir per job), and the frontend gates run concurrently instead
# of sequentially. Same commands as the sequential layout, only regrouped.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install baseline Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Resolve pinned toolchain (src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: |
          rustup component add rustfmt
          rustfmt --version

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            mold

      - name: Install baseline Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Resolve pinned toolchain (src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: |
          rustup component add clippy
          rustc --version
          cargo clippy --version

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri->target
          shared-key: ${{ runner.os }}-cargo

      - name: Set mold RUSTFLAGS (Linux only)
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: npm test
        run: npm test

      - name: npx tsc --noEmit
        run: npx tsc --noEmit

      - name: npx eslint src
        run: npx eslint src

      - name: npm run build
        run: npm run build

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Follow-up to #226 item 1: the root workspace and `src-tauri` pin the
      # toolchain in two separate files by design (no symlink, which is fragile
      # on Windows). This makes the "change both together" convention an
      # enforced check instead of a comment.
      - name: Toolchain channels match
        shell: bash
        run: |
          root=$(grep -E '^channel' rust-toolchain.toml)
          tauri=$(grep -E '^channel' src-tauri/rust-toolchain.toml)
          echo "root:  $root"
          echo "tauri: $tauri"
          test "$root" = "$tauri"

      - name: Install baseline Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Resolve pinned toolchain (rust-toolchain.toml)
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo clippy --version

      # brief §2.3/§2.4: the shared core must stay interface-free. This is the
      # enforced version of that rule (issue #160) — a Tauri/Clap/Ratatui/
      # Crossterm/React dependency creeping into `nexora-core` would let the
      # window app leak back into the terminal CLI.
      - name: Shared core has no UI/shell dependencies
        shell: bash
        run: |
          if cargo tree -p nexora-core --edges normal --prefix none \
            | tr ' ' '\n' \
            | grep -Eiq '^(tauri|tauri-[a-z-]+|clap|ratatui|crossterm|react(-[a-z]+)?)$'; then
            echo "::error::nexora-core must not depend on Tauri/Clap/Ratatui/Crossterm/React"
            cargo tree -p nexora-core --edges normal
            exit 1
          fi
          echo "nexora-core dependency tree is clean"
          cargo tree -p nexora-core --edges normal

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .->target
          shared-key: ${{ runner.os }}-cli

      - name: cargo fmt (cli)
        run: cargo fmt --all -- --check

      - name: cargo clippy (cli)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (cli)
        run: cargo test --all

      - name: Run stub --help/--version/doctor
        run: cargo run -p nexora-cli -- --help && cargo run -p nexora-cli -- --version && cargo run -p nexora-cli -- doctor
