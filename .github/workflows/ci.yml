name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Wall-clock split: fmt (no build), Rust gates per OS (clippy + test share
# one target dir per job), and the frontend gates run concurrently instead
# of sequentially. On pull requests, each job checks whether its dependency
# tree was touched relative to base; untouched suites report a fast green
# pass from the verified main baseline. Pushes to main always run all suites.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Rust files changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src-tauri/ crates/ apps/ Cargo.toml rust-toolchain.toml .github/workflows/ci.yml; then
            echo "No changes in Rust files — reusing green baseline from ${{ github.base_ref }}"
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install baseline Rust toolchain
        if: steps.changes.outputs.affected == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Resolve pinned toolchain (src-tauri/rust-toolchain.toml)
        if: steps.changes.outputs.affected == 'true'
        working-directory: src-tauri
        run: |
          rustup component add rustfmt
          rustfmt --version

      - name: cargo fmt --check
        if: steps.changes.outputs.affected == 'true'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            timeout: 20
          - os: windows-latest
            timeout: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if desktop Rust files changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src-tauri/ crates/ rust-toolchain.toml .github/workflows/ci.yml; then
            echo "No changes in src-tauri/ or crates/ — reusing green baseline from ${{ github.base_ref }}"
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Tauri system dependencies
        if: steps.changes.outputs.affected == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            mold

      - name: Install baseline Rust toolchain
        if: steps.changes.outputs.affected == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Resolve pinned toolchain (src-tauri/rust-toolchain.toml)
        if: steps.changes.outputs.affected == 'true'
        working-directory: src-tauri
        run: |
          rustup component add clippy
          rustc --version
          cargo clippy --version

      - name: sccache
        if: steps.changes.outputs.affected == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache
        if: steps.changes.outputs.affected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri->target
          shared-key: ${{ runner.os }}-cargo

      - name: Set mold RUSTFLAGS (Linux only)
        if: steps.changes.outputs.affected == 'true' && runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: cargo clippy
        if: steps.changes.outputs.affected == 'true'
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        if: steps.changes.outputs.affected == 'true'
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if frontend files changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src/ index.html package.json package-lock.json tsconfig.json tsconfig.node.json vite.config.ts eslint.config.js components.json .github/workflows/ci.yml; then
            echo "No changes in frontend files — reusing green baseline from ${{ github.base_ref }}"
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.affected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: steps.changes.outputs.affected == 'true'
        run: npm ci

      - name: npm test
        if: steps.changes.outputs.affected == 'true'
        run: npm test

      - name: npx tsc --noEmit
        if: steps.changes.outputs.affected == 'true'
        run: npx tsc --noEmit

      - name: npx eslint src
        if: steps.changes.outputs.affected == 'true'
        run: npx eslint src

      - name: npm run build
        if: steps.changes.outputs.affected == 'true'
        run: npm run build

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CLI or shared core files changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- crates/ apps/ Cargo.toml Cargo.lock rust-toolchain.toml src-tauri/rust-toolchain.toml .github/workflows/ci.yml; then
            echo "No changes in crates/ or apps/ — reusing green baseline from ${{ github.base_ref }}"
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain channels match
        if: steps.changes.outputs.affected == 'true'
        shell: bash
        run: |
          root=$(grep -E '^channel' rust-toolchain.toml)
          tauri=$(grep -E '^channel' src-tauri/rust-toolchain.toml)
          echo "root:  $root"
          echo "tauri: $tauri"
          test "$root" = "$tauri"

      - name: Install baseline Rust toolchain
        if: steps.changes.outputs.affected == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Resolve pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.affected == 'true'
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo clippy --version

      - name: Shared core has no UI/shell dependencies
        if: steps.changes.outputs.affected == 'true'
        shell: bash
        run: |
          if cargo tree -p nexora-core --edges normal --prefix none \
            | tr ' ' '\n' \
            | grep -Eiq '^(tauri|tauri-[a-z-]+|clap|ratatui|crossterm|react(-[a-z]+)?)$'; then
            echo "::error::nexora-core must not depend on Tauri/Clap/Ratatui/Crossterm/React"
            cargo tree -p nexora-core --edges normal
            exit 1
          fi
          echo "nexora-core dependency tree is clean"
          cargo tree -p nexora-core --edges normal

      - name: sccache
        if: steps.changes.outputs.affected == 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache
        if: steps.changes.outputs.affected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .->target
          shared-key: ${{ runner.os }}-cli

      - name: cargo fmt (cli)
        if: steps.changes.outputs.affected == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy (cli)
        if: steps.changes.outputs.affected == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (cli)
        if: steps.changes.outputs.affected == 'true'
        run: cargo test --all

      - name: Run stub --help/--version/doctor
        if: steps.changes.outputs.affected == 'true'
        run: cargo run -p nexora-cli -- --help && cargo run -p nexora-cli -- --version && cargo run -p nexora-cli -- doctor

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if dependency manifests or lockfiles changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- Cargo.toml Cargo.lock deny.toml src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/deny.toml crates/ apps/ .github/workflows/ci.yml; then
            echo "No changes in Cargo manifests or lockfiles — reusing green baseline from ${{ github.base_ref }}"
            echo "affected=false" >> "$GITHUB_OUTPUT"
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install baseline Rust toolchain
        if: steps.changes.outputs.affected == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        if: steps.changes.outputs.affected == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check advisories (src-tauri)
        if: steps.changes.outputs.affected == 'true'
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories

      - name: cargo deny check advisories (root workspace)
        if: steps.changes.outputs.affected == 'true'
        run: cargo deny --manifest-path Cargo.toml check advisories
