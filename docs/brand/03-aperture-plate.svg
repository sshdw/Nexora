<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Nexora Prism — Aperture app icon">
  <title>Nexora Prism — Aperture (app icon)</title>
  <defs>
    <linearGradient id="plate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#26262e"/><stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="21.5" fill="url(#plate)"/>
  <rect x="0.35" y="0.35" width="95.3" height="95.3" rx="21.2" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.7"/>
  <g transform="translate(48 48) scale(0.60) translate(-48 -48)">

  
  <!-- APERTURE. Hollow prism: the outer triangle with an aperture that is the
       same triangle scaled 0.42 about the shared centroid, so all three walls
       stay optically even. One path, one colour, holds at 16 px. -->
  <path fill="#ffffff" fill-rule="evenodd"
        d="M48 6 L92 88 L4 88 Z M48 34.7 L68.9 70.5 L27.1 70.5 Z"/>

  </g>
</svg>
