<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Nexora Prism — Displace app icon">
  <title>Nexora Prism — Displace (app icon)</title>
  <defs>
    <linearGradient id="plate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#26262e"/><stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="21.5" fill="url(#plate)"/>
  <rect x="0.35" y="0.35" width="95.3" height="95.3" rx="21.2" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.7"/>
  <g transform="translate(49 48) scale(0.60) translate(-48 -48)">

  
  <!-- DISPLACE. One triangle cut vertically; the halves slide apart and out of
       register, the way a ray kinks when it crosses a boundary. Two tones keep
       the seam legible; it never turns into a second colour. -->
  <path fill="#ffffff" d="M42 8 L42 88 L6 88 Z"/>
  <path fill="#ffffff" fill-opacity=".58" d="M52 20 L86 88 L52 88 Z"/>

  </g>
