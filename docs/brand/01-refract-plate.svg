<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Nexora Prism — Refract app icon">
  <title>Nexora Prism — Refract (app icon)</title>
  <defs>
    <linearGradient id="plate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#26262e"/><stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="21.5" fill="url(#plate)"/>
  <rect x="0.35" y="0.35" width="95.3" height="95.3" rx="21.2" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.7"/>
  <g transform="translate(46 49) scale(0.60) translate(-48 -48)">

  
  <!-- PRISM + BEAM. Solid prism (apex 40,20; base y=76) with a shaded left
       facet, one beam entering from the left, three beams leaving to the
       right. Beams are closed polygons, so they keep their shape at any size.
       Single asset for 32 px and up; below that use 01-refract-small.svg. -->
  <path fill="#ffffff" d="M40 20 L72 76 L8 76 Z"/>
  <path fill="#ffffff" fill-opacity=".55" d="M40 20 L40 76 L8 76 Z"/>
  <path fill="#ffffff" d="M0 47 L17 47 L17 56 L0 56 Z"/>
  <path fill="#ffffff" d="M54 29 L92 16 L92 25 L54 37 Z"/>
  <path fill="#ffffff" d="M61 42 L94 38 L94 47 L61 50 Z"/>
  <path fill="#ffffff" d="M68 61 L92 69 L92 78 L68 70 Z"/>

  </g>
</svg>
