[package]
name = "nexora-cli"
version = "0.1.0"
description = "Nexora CLI stub (phase 0): offline --help/--version/doctor; interactive TUI lands in later phases"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[[bin]]
name = "nexora"
path = "src/main.rs"

[dependencies]
# Shared, interface-free core (issue #160, brief §2.3/§2.4): the stable
# error taxonomy + exit-code table, the three-manifest version parity, and
# the allow-listed config keys. The dependency arrow points CLI -> core, so
# `doctor` and Desktop `ReleasePanel` read the same facts from the same code
# instead of maintaining two copies. `nexora-core` does not depend on Clap.
nexora-core = { path = "../../crates/nexora-core" }
# Phase 0 needs argument parsing only. Ratatui/Crossterm (brief §2.1:
# Ratatui 0.30.2 + Crossterm 0.29) are deliberately NOT depended on yet —
# the stub must never open a fullscreen TUI; they arrive with the
# interactive phase.
clap = { version = "4.5", features = ["derive"] }
# Same SQLite version as the desktop backend; opened READ-ONLY by `doctor`
# (never creates or migrates the database).
rusqlite = { version = "0.32", features = ["bundled"] }
# Same OS-keyring abstraction as the desktop credential store
# (`src-tauri/.../providers/credentials.rs`, service namespace "nexora");
# the stub only probes availability, never reads values.
keyring = "4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
