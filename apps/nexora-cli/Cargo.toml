[package]
name = "nexora-cli"
version = "0.1.0"
description = "Nexora CLI: offline diagnostics, shared facts, machine run output, and an interactive TUI"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[[bin]]
name = "nexora"
path = "src/main.rs"

[dependencies]
# Shared, interface-free core (issue #160, brief §2.3/§2.4): the stable
# error taxonomy + exit-code table, the three-manifest version parity, and
# the allow-listed config keys. The dependency arrow points CLI -> core, so
# `doctor` and Desktop `ReleasePanel` read the same facts from the same code
# instead of maintaining two copies. `nexora-core` does not depend on Clap.
nexora-core = { path = "../../crates/nexora-core" }
# Shared backend runtime (PR-1 extraction). Linked here so the CLI and the
# Desktop compile the same application/infrastructure code; no CLI behavior
# is wired to it in this PR.
nexora-runtime = { path = "../../crates/nexora-runtime" }
# Argument parsing (pure, offline) plus Ratatui for the phase-5 interactive
# TUI (brief §2.1: Ratatui 0.30.2, Crossterm 0.29). Crossterm is used ONLY
# through Ratatui's `ratatui::crossterm` re-export (one major, one source of
# input events); there is no direct Crossterm dependency and no async runtime.
clap = { version = "4.5", features = ["derive"] }
# Phase 5 (issue #164): fullscreen TUI on an interactive TTY only. MIT licensed,
# MSRV below the pinned toolchain. The default `crossterm` feature supplies the
# `ratatui::crossterm` re-export; `TestBackend` powers the no-real-terminal tests.
ratatui = "0.30.2"
# Versioned machine output (phase 4a): `serde_json::Map` is the generic
# `WireFrame` envelope. `serde` derives the frame envelope; neither crate
# carries a runtime, touches the network, or reads a credential. Both versions
# are already locked by `nexora-core`, so this adds no new lock entry.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same SQLite version as the desktop backend; opened READ-ONLY by `doctor`
# (never creates or migrates the database).
rusqlite = { version = "0.41", features = ["bundled"] }
# Same OS-keyring abstraction as the desktop credential store
# (`src-tauri/.../providers/credentials.rs`, service namespace "nexora");
# used for the credential-presence probe and the hidden-input write target.
keyring = "4"
# Hidden terminal input for `nexora auth set`. Disabling echo correctly needs
# termios/Win32 calls; this crate forbids `unsafe_code`, so hand-rolled FFI is
# not an option. `rpassword 7.5` is Apache-2.0, MSRV 1.85 (< our pinned 1.97.1),
# and reads/writes via `/dev/tty` (`CONIN$`/`CONOUT$` on Windows), never argv.
rpassword = "7.5"
# OWNER-APPROVED SCOPED EXCEPTION (#163 4b): Tokio drives ONLY the provider
# HTTP reactor through `nexora_runtime::AsyncSpawner` (see provider_reactor.rs).
# It is NOT used by the agent loop, the run/forwarder threads, the CLI command
# layer, or the TUI. MIT licensed and already in the workspace lockfile via the
# provider transports: no copyleft dependency, no deny.toml change.
tokio = { version = "1", features = ["rt", "net", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
