[package]
name = "nexora-cli"
version = "0.1.0"
description = "Nexora CLI stub (phase 0): offline --help/--version/doctor; interactive TUI lands in later phases"
license = "MIT"
authors = ["Nexora Team"]
edition = "2021"

[[bin]]
name = "nexora"
path = "src/main.rs"

[dependencies]
# Shared, interface-free core (issue #160, brief §2.3/§2.4): the stable
# error taxonomy + exit-code table, the three-manifest version parity, and
# the allow-listed config keys. The dependency arrow points CLI -> core, so
# `doctor` and Desktop `ReleasePanel` read the same facts from the same code
# instead of maintaining two copies. `nexora-core` does not depend on Clap.
nexora-core = { path = "../../crates/nexora-core" }
# Phase 0 needs argument parsing only. Ratatui/Crossterm (brief §2.1:
# Ratatui 0.30.2 + Crossterm 0.29) are deliberately NOT depended on yet —
# the stub must never open a fullscreen TUI; they arrive with the
# interactive phase.
clap = { version = "4.5", features = ["derive"] }
# Versioned machine output (phase 4a): `serde_json::Map` is the generic
# `WireFrame` envelope. `serde` derives the frame envelope; neither crate
# carries a runtime, touches the network, or reads a credential. Both versions
# are already locked by `nexora-core`, so this adds no new lock entry.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same SQLite version as the desktop backend; opened READ-ONLY by `doctor`
# (never creates or migrates the database).
rusqlite = { version = "0.41", features = ["bundled"] }
# Same OS-keyring abstraction as the desktop credential store
# (`src-tauri/.../providers/credentials.rs`, service namespace "nexora");
# used for the credential-presence probe and the hidden-input write target.
keyring = "4"
# Hidden terminal input for `nexora auth set`. Disabling echo correctly needs
# termios/Win32 calls; this crate forbids `unsafe_code`, so hand-rolled FFI is
# not an option. `rpassword 7.5` is Apache-2.0, MSRV 1.85 (< our pinned 1.97.1),
# and reads/writes via `/dev/tty` (`CONIN$`/`CONOUT$` on Windows), never argv.
rpassword = "7.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
